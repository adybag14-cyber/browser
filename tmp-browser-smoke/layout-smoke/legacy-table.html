<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Legacy Table Base</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #1f1f1f;
      font: 16px/1.4 sans-serif;
    }
    .logo {
      width: 272px;
      height: 92px;
      margin: 0 auto 18px auto;
      background: #4d88ff;
      color: #fff;
      font-size: 42px;
      font-weight: bold;
      line-height: 92px;
      text-align: center;
    }
    .search-shell {
      display: inline-block;
      width: 496px;
      height: 32px;
      margin: 4px 0;
      background: #cfcfcf;
      border: 1px solid #999;
    }
    .search-shell input {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0 10px;
      border: none;
      background: transparent;
      font: 18px sans-serif;
      box-sizing: border-box;
    }
    .ds {
      display: inline-block;
      margin: 4px 6px 0 6px;
    }
    .lsbb {
      display: block;
      background: #ececec;
      border: 1px solid #aaa;
      height: 30px;
    }
    .lsb {
      height: 30px;
      border: none;
      background: transparent;
      font: 15px sans-serif;
      padding: 0 16px;
    }
    .side-pill {
      width: 120px;
      height: 26px;
      background: #24a264;
      color: #fff;
      text-align: center;
      line-height: 26px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <center>
    <div class="logo">G</div>
    <form id="legacy-search-form" action="/legacy-table.html" method="get">
      <table cellpadding="0" cellspacing="0">
        <tr valign="top">
          <td width="25%">&nbsp;</td>
          <td align="center" nowrap>
            <div class="search-shell"><input id="legacy-query" name="q" value=""></div>
            <input id="legacy-trace" name="trace" type="hidden" value="">
            <br>
            <span class="ds"><span class="lsbb"><input class="lsb" value="Google Search" type="submit"></span></span>
            <span class="ds"><span class="lsbb"><input class="lsb" value="I'm Feeling Lucky" type="submit"></span></span>
          </td>
          <td align="left" width="25%">
            <div class="side-pill">Advanced</div>
          </td>
        </tr>
      </table>
    </form>
  </center>
  <script>
    (function () {
      const form = document.getElementById('legacy-search-form');
      const input = document.getElementById('legacy-query');
      const traceInput = document.getElementById('legacy-trace');
      const params = new URLSearchParams(window.location.search);
      const submittedValue = params.get('q');
      const submittedTrace = params.get('trace');
      const traceParts = [];

      function mark(value) {
        document.title = value;
      }

      function pushTrace(label) {
        traceParts.push(label);
        traceInput.value = traceParts.join(',');
        return traceInput.value;
      }

      if (!form || !input || !traceInput) {
        mark('NOQ');
        return;
      }

      if (submittedValue !== null) {
        input.value = submittedValue;
        traceInput.value = submittedTrace || '';
        mark('SUBMITTED:' + submittedValue + ':' + traceInput.value);
        return;
      }

      input.addEventListener('focus', function () {
        mark('FOCUSED');
      });

      input.addEventListener('input', function () {
        mark('TYPED:' + input.value);
      });

      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.keyCode === 13 || event.which === 13) {
          mark('KEYDOWN:' + input.value + ':' + pushTrace('KEYDOWN') + ':' + event.keyCode + ':' + event.which);
        }
      });

      input.addEventListener('keypress', function (event) {
        if (event.key === 'Enter' || event.keyCode === 13 || event.which === 13) {
          mark('KEYPRESS:' + input.value + ':' + pushTrace('KEYPRESS') + ':' + event.keyCode + ':' + event.which);
        }
      });

      form.addEventListener('submit', function () {
        mark('SUBMIT:' + input.value + ':' + pushTrace('SUBMIT'));
      });

      mark('BOUND');
    })();
  </script>
</body>
</html>
