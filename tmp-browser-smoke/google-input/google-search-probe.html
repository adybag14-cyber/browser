<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Probe Ready</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202124;
      display: grid;
      place-items: center;
    }

    main {
      width: min(720px, calc(100vw - 48px));
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 0;
      color: #4285f4;
    }

    .search-shell {
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    .search-row {
      width: 100%;
      display: flex;
      align-items: center;
      border: 2px solid #5aa7b8;
      border-radius: 999px;
      background: #dff8ff;
      box-sizing: border-box;
      padding: 10px 18px;
    }

    .search-row input[type="text"] {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202124;
      font-size: 24px;
      line-height: 1.3;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .actions input[type="submit"] {
      border: 1px solid #dadce0;
      background: #f8f9fa;
      color: #202124;
      font-size: 15px;
      padding: 10px 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Google</h1>
    <form name="f" action="/submitted.html" method="get">
      <input type="hidden" name="source" value="hp">
      <div class="search-shell">
        <div class="search-row">
          <input
            id="search-input"
            class="lst"
            name="q"
            type="text"
            autocomplete="off"
            title="Google Search"
            aria-label="Search"
          >
        </div>
        <div class="actions">
          <input class="lsb" name="btnG" type="submit" value="Google Search">
        </div>
      </div>
    </form>
  </main>
  <script>
    (function () {
      var form = document.forms.f;
      var input = form.q;

      function setTitle(prefix) {
        document.title = prefix + (input.value ? ":" + input.value : "");
      }

      input.addEventListener("focus", function () {
        setTitle("FOCUS");
      });

      input.addEventListener("input", function () {
        setTitle("TYPE");
      });

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          setTitle("ENTER");
        }
      });

      form.addEventListener("submit", function () {
        form.action = "/submitted.html?entry=" + encodeURIComponent(input.value);
        setTitle("SUBMITTING");
      });
    })();
  </script>
</body>
</html>
