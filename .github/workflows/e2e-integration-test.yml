name: e2e-integration-test

env:
  LIGHTPANDA_DISABLE_TELEMETRY: true

on:
  schedule:
    - cron: "4 4 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  zig-build-release:
    name: zig build release

    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Don't run the CI with draft PR.
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install

      - name: zig build release
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast -Dcpu=x86_64

      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightpanda-build-release
          path: |
            zig-out/bin/lightpanda
          retention-days: 1

  demo-scripts:
    name: demo-integration-scripts
    needs: zig-build-release

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: 'lightpanda-io/demo'
          fetch-depth: 0

      - run: npm install

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lightpanda-build-release

      - run: chmod a+x ./lightpanda

      - name: LP Cache
        id: lp-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/lp-cache
          key: v1

      - name: run end to end integration tests
        id: integration
        continue-on-error: true
        env:
          MASSIVE_PROXY_RESIDENTIAL_US: ${{ secrets.MASSIVE_PROXY_RESIDENTIAL_US }}
        run: |
          proxy_args=()
          if [ -n "${MASSIVE_PROXY_RESIDENTIAL_US:-}" ]; then
            proxy_args=(--http-proxy "$MASSIVE_PROXY_RESIDENTIAL_US")
          fi
          ./lightpanda serve --http-cache-dir /tmp/lp-cache "${proxy_args[@]}" --log-level error &
          echo $! > LPD.pid
          set +e
          go run integration/main.go | tee result.log
          integration_status=${PIPESTATUS[0]}
          kill "$(cat LPD.pid)" 2>/dev/null || true
          exit "$integration_status"

      - name: Upload integration result
        if: always() && hashFiles('result.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-integration-result-${{ github.run_id }}
          path: result.log
          retention-days: 7

      - name: Send result to slack
        # Slack credentials are intentionally not available to forks. Keep the
        # upstream report, but do not turn a successful fork E2E run red.
        if: github.repository == 'lightpanda-io/browser'
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          errors: true
          method: files.uploadV2
          token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          payload: |
            channel_id: ${{ vars.E2E_SLACK_CHANNEL_ID }}
            initial_comment: "Last e2e integration tests"
            file: "./result.log"
            filename: "e2e-integration-${{ github.sha }}.txt"

      - name: Fail if integration tests failed
        if: steps.integration.outcome == 'failure' && github.repository == 'lightpanda-io/browser'
        run: exit 1
