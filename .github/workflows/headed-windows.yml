          if($fvKeyboard.green -lt 5000 -or $fvKeyboard.blue -gt 50){ throw "Keyboard activity did not enable focus-visible: green=$($fvKeyboard.green) blue=$($fvKeyboard.blue)" }
          if($fvTab.green -lt 5000 -or $fvTab.blue -gt 50){ throw "Tab-focused button is not focus-visible: green=$($fvTab.green) blue=$($fvTab.blue)" }
          if($fvText.cyan -lt 7000){ throw "Pointer-focused text input is not focus-visible: cyan=$($fvText.cyan)" }
          $fvPointerInfo = Get-PngInfo 'focus-visible-pointer-button.png'
          $fvKeyboardInfo = Get-PngInfo 'focus-visible-keyboard-same.png'
          if($fvPointerInfo.sha256 -eq $fvKeyboardInfo.sha256){ throw 'Keyboard modality produced no focus-visible PNG change' }

          $resizeResultPath = Get-EvidenceFile 'resize-result.txt'
          $resizeResult = (Get-Content $resizeResultPath -Raw).Trim()
          if ($resizeResult -ne 'NATIVE_RESIZE_OK') { throw "Unexpected native-resize marker: $resizeResult" }
          $resizeBeforeState = Get-Content (Get-EvidenceFile 'resize-before-state.json') -Raw | ConvertFrom-Json
          $resizeAfterState = Get-Content (Get-EvidenceFile 'resize-after-state.json') -Raw | ConvertFrom-Json
          if ($resizeBeforeState.kind -ne 'load' -or [int]$resizeBeforeState.w -ne 900 -or [int]$resizeBeforeState.h -ne 760 -or $resizeBeforeState.color -ne 'rgb(255,0,0)') {
            throw "Unexpected pre-resize state: $($resizeBeforeState | ConvertTo-Json -Compress)"
          }
          if ($resizeAfterState.kind -ne 'resize' -or [int]$resizeAfterState.w -ne 660 -or [int]$resizeAfterState.h -ne 700 -or $resizeAfterState.color -ne 'rgb(0,255,0)') {
            throw "Unexpected post-resize state: $($resizeAfterState | ConvertTo-Json -Compress)"
          }
          $resizeBefore = Get-PngInfo 'resize-before.png'
          $resizeAfter = Get-PngInfo 'resize-after.png'
          if ($resizeBefore.width -ne 900 -or $resizeBefore.height -ne 760) { throw "Pre-resize PNG is $($resizeBefore.width)x$($resizeBefore.height), expected 900x760" }
          if ($resizeAfter.width -ne 660 -or $resizeAfter.height -ne 700) { throw "Post-resize PNG is $($resizeAfter.width)x$($resizeAfter.height), expected 660x700" }
          function Get-ResizeColorCounts([string]$Name) {
            $path = Get-EvidenceFile $Name
            $bitmap = [System.Drawing.Bitmap]::new($path)
            try {
              $red=0; $green=0
              for ($y=80; $y -lt [Math]::Min(500,$bitmap.Height); $y++) {
                for ($x=20; $x -lt [Math]::Min(700,$bitmap.Width); $x++) {
                  $pixel=$bitmap.GetPixel($x,$y)
                  if ($pixel.R -eq 255 -and $pixel.G -eq 0 -and $pixel.B -eq 0) { $red++ }
                  elseif ($pixel.R -eq 0 -and $pixel.G -eq 255 -and $pixel.B -eq 0) { $green++ }
                }
              }
              return [pscustomobject]@{red=$red;green=$green}
            } finally { $bitmap.Dispose() }
          }
          $resizeBeforeColors=Get-ResizeColorCounts 'resize-before.png'
          $resizeAfterColors=Get-ResizeColorCounts 'resize-after.png'
          if ($resizeBeforeColors.red -lt 70000 -or $resizeBeforeColors.green -gt 50) { throw "Unexpected pre-resize pixels: red=$($resizeBeforeColors.red) green=$($resizeBeforeColors.green)" }
          if ($resizeAfterColors.green -lt 60000 -or $resizeAfterColors.red -gt 50) { throw "Responsive resize did not repaint green: red=$($resizeAfterColors.red) green=$($resizeAfterColors.green)" }
          if ($resizeBefore.sha256 -eq $resizeAfter.sha256) { throw 'Native resize produced no PNG change' }

          $frames = @(
            Get-PngInfo 'frame-before.png'
            Get-PngInfo 'frame-typed.png'
            Get-PngInfo 'frame-clicked.png'
            Get-PngInfo 'frame-after.png'
          )

          $width = $frames[0].width
          $height = $frames[0].height
          foreach ($frame in $frames) {
            if ($frame.width -ne $width -or $frame.height -ne $height) {
              throw "PNG viewport mismatch: $($frame.name) is $($frame.width)x$($frame.height), expected ${width}x${height}"
            }
          }

          if ($frames[0].sha256 -eq $frames[1].sha256) {
            throw 'Typing did not change the headed PNG evidence'
          }
          if ($frames[0].sha256 -eq $frames[3].sha256) {
            throw 'Verification did not change the headed PNG evidence'
          }

          $memoryPath = Get-EvidenceFile 'memory-summary.json'
          $memory = Get-Content $memoryPath -Raw | ConvertFrom-Json
          foreach ($property in @(
            'peak_working_set_mb',
            'peak_private_mb',
            'working_set_growth_mb',
            'private_growth_mb',
            'peak_gdi_objects',
            'gdi_object_growth',
            'sampled_seconds',
            'memory_budget_mb',
            'memory_growth_budget_mb'
          )) {
            if ($null -eq $memory.PSObject.Properties[$property]) {
              throw "memory-summary.json is missing $property"
            }
          }
          if ([double]$memory.peak_working_set_mb -gt [double]$memory.memory_budget_mb) {
            throw "Recorded RSS exceeds its budget: $($memory.peak_working_set_mb) MiB > $($memory.memory_budget_mb) MiB"
          }
          if ([double]$memory.working_set_growth_mb -gt [double]$memory.memory_growth_budget_mb) {
            throw "Recorded RSS growth exceeds its budget: $($memory.working_set_growth_mb) MiB > $($memory.memory_growth_budget_mb) MiB"
          }

          $frameSummary = [pscustomobject]@{
            result = $frameResult
            viewport_width = $width
            viewport_height = $height
            typing_changed_png = $true
            verification_changed_png = $true
            native_keyboard_result = $keyboardResult
            native_caret_result = $caretResult
            native_navigation_result = $navigationResult
            single_line_input_result = $longInputResult
            single_line_input_text_bands = $longInputBands
            single_line_input_screenshot = $longInputShot
            visible_caret_changed_png = $true
            caret_screenshots = @($caretFocused, $caretBlurred, $caretEdited)
            screenshots = $frames
            google_bootstrap_result = $bootstrapResult
            google_bootstrap_screenshot = $bootstrapShot
            google_layout_result = $googleLayoutResult
            google_layout_geometry = $googleGeometry
            google_layout_screenshot = $googleLayoutShot
            google_layout_blue_border_width = $googleBlueWidth
            google_layout_blue_border_height = $googleBlueHeight
            wikipedia_portal_result = $wikipediaPortalResult
            wikipedia_portal_geometry = $wikipediaPortalGeometry
            wikipedia_portal_screenshot = $wikipediaPortalShot
            wikipedia_search_result = $wikipediaSearchResult
            wikipedia_search_geometry = $wikipediaSearchGeometry
            wikipedia_search_screenshot = $wikipediaSearchShot
            wikipedia_search_blue_button_width = $wikiBlueWidth
            wikipedia_search_blue_button_height = $wikiBlueHeight
          }
          $frameSummary | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8 (Join-Path $artifacts 'frame-summary.json')

          Write-Host "Validated $($frames.Count) PNGs at ${width}x${height}"
          Write-Host "Peak RSS: $($memory.peak_working_set_mb) MiB; RSS growth: $($memory.working_set_growth_mb) MiB over $($memory.sampled_seconds) seconds"

      - name: Upload headed visual and memory evidence
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headed-windows-evidence-${{ github.run_id }}
          path: |
            ci/headed/artifacts/**/*.png
            ci/headed/artifacts/**/*.csv
            ci/headed/artifacts/**/*.json
            ci/headed/artifacts/**/*.txt
            ci/headed/artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish headed evidence summary
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence-upload.outputs.artifact-url }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
        run: |
          $ErrorActionPreference = 'Continue'
          $artifacts = './ci/headed/artifacts'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('# Headed Windows evidence')
          $lines.Add('')
          $lines.Add("**Job status:** $env:JOB_STATUS")
          $lines.Add('')

          $framePath = Join-Path $artifacts 'frame-summary.json'
          if (Test-Path $framePath) {
            $frame = Get-Content $framePath -Raw | ConvertFrom-Json
            $lines.Add('## Nested-frame interaction')
            $lines.Add('')
            $lines.Add("Result: **$($frame.result)**")
            if ($frame.native_keyboard_result) { $lines.Add("Native keyboard: **$($frame.native_keyboard_result)**") }
            if ($frame.native_caret_result) { $lines.Add("Native pointer caret: **$($frame.native_caret_result)**") }
            if ($frame.native_navigation_result) { $lines.Add("Native text navigation: **$($frame.native_navigation_result)**") }
            if ($frame.single_line_input_result) { $lines.Add("Single-line input paint: **$($frame.single_line_input_result)** ($($frame.single_line_input_text_bands) text band)") }
            if ($frame.visible_caret_changed_png) { $lines.Add('Visible input caret: **focused/blurred PNGs differ**') }
            if ($frame.caret_screenshots) {
              $lines.Add('')
              $lines.Add('| Caret screenshot | Dimensions | Bytes | SHA-256 |')
              $lines.Add('| --- | ---: | ---: | --- |')
              foreach ($shot in $frame.caret_screenshots) {
                $shortHash = ([string]$shot.sha256).Substring(0, 16)
                $lines.Add("| $($shot.name) | $($shot.width)x$($shot.height) | $($shot.bytes) | ``$shortHash.`` |")
              }
            }
            $lines.Add('')
            $lines.Add('| Screenshot | Dimensions | Bytes | SHA-256 |')
            $lines.Add('| --- | ---: | ---: | --- |')
            foreach ($shot in $frame.screenshots) {
              $shortHash = ([string]$shot.sha256).Substring(0, 16)
              $lines.Add("| $($shot.name) | $($shot.width)x$($shot.height) | $($shot.bytes) | ``$shortHash…`` |")
            }
            $lines.Add('')
            if ($frame.google_bootstrap_result) {
              $lines.Add('## Google-style JavaScript bootstrap')
              $lines.Add('')
              $lines.Add("Result: **$($frame.google_bootstrap_result)**")
              $shot = $frame.google_bootstrap_screenshot
              if ($shot) {
                $shortHash = ([string]$shot.sha256).Substring(0, 16)
                $lines.Add('')
                $lines.Add("Post-redirect screenshot: $($shot.width)x$($shot.height), $($shot.bytes) bytes, ``$shortHash…``")
              }
              $lines.Add('')
            }
          } else {
            $lines.Add('## Nested-frame interaction')
            $lines.Add('')
            $lines.Add('No validated frame summary was produced. Inspect the uploaded logs and PNGs.')
            $lines.Add('')
          }

          $memoryPath = Join-Path $artifacts 'memory-summary.json'
          if (Test-Path $memoryPath) {
            $memory = Get-Content $memoryPath -Raw | ConvertFrom-Json
            $lines.Add('## Repaint memory gate')
            $lines.Add('')
            $lines.Add('| Metric | Observed | Budget |')
            $lines.Add('| --- | ---: | ---: |')
            $lines.Add("| Peak working set | $($memory.peak_working_set_mb) MiB | $($memory.memory_budget_mb) MiB |")
            $lines.Add("| Working-set growth | $($memory.working_set_growth_mb) MiB | $($memory.memory_growth_budget_mb) MiB |")
            $lines.Add("| Peak private bytes | $($memory.peak_private_mb) MiB | — |")
            $lines.Add("| Private-byte growth | $($memory.private_growth_mb) MiB | — |")
            $lines.Add("| Peak GDI objects | $($memory.peak_gdi_objects) | — |")
            $lines.Add("| GDI-object growth | $($memory.gdi_object_growth) | 2 |")
            $lines.Add("| Sample window | $($memory.sampled_seconds) s | — |")
            $lines.Add('')
          } else {
            $lines.Add('## Repaint memory gate')
            $lines.Add('')
            $lines.Add('No memory summary was produced. Inspect the uploaded process logs.')
            $lines.Add('')
          }

          if (-not [string]::IsNullOrWhiteSpace($env:EVIDENCE_ARTIFACT_URL)) {
            $lines.Add("**Evidence artifact:** [$env:EVIDENCE_ARTIFACT_URL]($env:EVIDENCE_ARTIFACT_URL)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:EVIDENCE_ARTIFACT_DIGEST)) {
            $lines.Add('')
            $lines.Add("**Artifact digest:** ``$env:EVIDENCE_ARTIFACT_DIGEST``")
          }

          $lines -join [Environment]::NewLine |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload headed executable
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightpanda-headed-windows-${{ github.sha }}
          path: zig-out/bin/lightpanda-headed.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
