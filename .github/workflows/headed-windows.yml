name: Headed Windows

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - headed-mode-foundation
      - 'headed-*'

permissions:
  contents: read

concurrency:
  group: headed-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  ZIG_ARCHIVE_SHA256: 68659EB5F1E4EB1437A722F1DD889C5A322C9954607F5EDCF337BC3684A75A7E
  ZIG_ARCHIVE_SIZE: '97217739'
  V8_VERSION: 14.9.207.35
  V8_SHA256: CD843919F6B14056DE6043DE858141460688DD5A8CCBC2F0BE0D4C0911A46BF9
  V8_ARCHIVE_SHA256: 1F42146F8E6082E0B95B24184003984168BE0A5F69D1354820C08E3A0F05527B
  V8_RELEASE_TAG: windows-headed-v8-14.9.207.35-1
  V8_ARCHIVE: c_v8_14.9.207.35_windows_x86_64_debug.7z

jobs:
  headed:
    name: Build + native headed evidence
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Zig
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archiveName = "zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installRoot = Join-Path $env:RUNNER_TEMP 'zig-install'
          $zigDir = Join-Path $installRoot "zig-x86_64-windows-$env:ZIG_VERSION"
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/$archiveName"

          Remove-Item $archivePath -Force -ErrorAction SilentlyContinue
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue

          & curl.exe -L --fail --retry 4 --retry-all-errors -o $archivePath $url
          if ($LASTEXITCODE -ne 0) {
            throw "Zig download failed with exit code $LASTEXITCODE"
          }

          $archive = Get-Item $archivePath
          if ($archive.Length -ne [int64]$env:ZIG_ARCHIVE_SIZE) {
            throw "Zig archive size mismatch: $($archive.Length) != $env:ZIG_ARCHIVE_SIZE"
          }

          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash
          if ($actual -ne $env:ZIG_ARCHIVE_SHA256) {
            throw "Zig archive checksum mismatch: $actual != $env:ZIG_ARCHIVE_SHA256"
          }

          New-Item -ItemType Directory -Force $installRoot | Out-Null
          & 7z x $archivePath "-o$installRoot" -y | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Zig extraction failed with exit code $LASTEXITCODE"
          }
          Remove-Item $archivePath -Force

          $zigExe = Join-Path $zigDir 'zig.exe'
          if (-not (Test-Path $zigExe -PathType Leaf)) {
            throw "Zig executable was not extracted at $zigExe"
          }

          $zigDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $globalCache = Join-Path $env:RUNNER_TEMP "zig-global-cache-$env:ZIG_VERSION"
          New-Item -ItemType Directory -Force (Join-Path $globalCache 'tmp') | Out-Null
          "ZIG_GLOBAL_CACHE_DIR=$globalCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $installedVersion = (& $zigExe version).Trim()
          if ($installedVersion -ne $env:ZIG_VERSION) {
            throw "Unexpected Zig version: $installedVersion != $env:ZIG_VERSION"
          }
          Write-Host "Verified Zig ${installedVersion}: $actual"

      - name: Restore Windows V8
        id: v8-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/v8/c_v8.lib
          key: headed-v8-windows-${{ env.V8_VERSION }}-${{ env.V8_SHA256 }}

      - name: Download immutable Windows V8
        if: steps.v8-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .ci-cache/v8 | Out-Null
          $url = "https://github.com/adybag14-cyber/zig-v8-fork/releases/download/$env:V8_RELEASE_TAG/$env:V8_ARCHIVE"
          & curl.exe -L --fail --retry 4 --retry-all-errors -o .ci-cache/v8/v8.7z $url
          if ($LASTEXITCODE -ne 0) { throw "V8 download failed with exit code $LASTEXITCODE" }
          $archiveHash = (Get-FileHash .ci-cache/v8/v8.7z -Algorithm SHA256).Hash
          if ($archiveHash -ne $env:V8_ARCHIVE_SHA256) {
            throw "V8 archive checksum mismatch: $archiveHash != $env:V8_ARCHIVE_SHA256"
          }
          $extractDir = (Resolve-Path '.ci-cache/v8').Path
          & 7z x .ci-cache/v8/v8.7z "-o$extractDir" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed with exit code $LASTEXITCODE" }
          Remove-Item .ci-cache/v8/v8.7z -Force

      - name: Verify Windows V8 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path '.ci-cache/v8/c_v8.lib').Path
          $actual = (Get-FileHash $path -Algorithm SHA256).Hash
          if ($actual -ne $env:V8_SHA256) {
            throw "V8 checksum mismatch: $actual != $env:V8_SHA256"
          }
          Write-Host "Verified V8 $($env:V8_VERSION): $actual"

      - name: Build headed browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v8 = (Resolve-Path '.ci-cache/v8/c_v8.lib').Path
          zig build headed -j1 -Dtarget=x86_64-windows-msvc "-Dprebuilt_v8_path=$v8"

      - name: Reject unsupported headed commands without crashing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'headed-unsupported.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'headed-unsupported.stderr.txt'
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath './zig-out/bin/lightpanda-headed.exe' `
            -ArgumentList @('fetch', 'https://example.com') `
            -PassThru -Wait -NoNewWindow `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr

          $stdoutText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          $stderrText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          $text = $stdoutText + "`n" + $stderrText
          Write-Host $text

          if ($process.ExitCode -ne 2) {
            throw "Expected unsupported headed command to exit 2, got $($process.ExitCode)"
          }
          if ($text -notmatch 'supports only the browse command') {
            throw 'Unsupported-command diagnostic was not emitted'
          }
          if ($text -match 'debug-only-panic|Lightpanda has crashed') {
            throw 'Unsupported headed command triggered the crash handler'
          }

      - name: Run deterministic headed frame + RSS smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./ci/headed/run-headed-smoke.ps1 `
            -Executable ./zig-out/bin/lightpanda-headed.exe `
            -Artifacts ./ci/headed/artifacts `
            -Mode All `
            -MemoryUrl http://127.0.0.1:18773/rich.html `
            -MemoryWarmupMs 2000 `
            -MemorySampleCount 120 `
            -MemorySampleIntervalMs 500 `
            -MemoryBudgetMb 256 `
            -MemoryGrowthBudgetMb 5

      - name: Validate headed PNG and memory evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $artifacts = (Resolve-Path './ci/headed/artifacts').Path

          function Read-BigEndianUInt32([byte[]]$Bytes, [int]$Offset) {
            return [uint32](
              ([uint32]$Bytes[$Offset] * 16777216) +
              ([uint32]$Bytes[$Offset + 1] * 65536) +
              ([uint32]$Bytes[$Offset + 2] * 256) +
              [uint32]$Bytes[$Offset + 3]
            )
          }

          function Get-EvidenceFile([string]$Name) {
            # The smoke runner may retain an internal state copy of a geometry
            # marker and also copy the canonical evidence file to artifact root.
            # Prefer that canonical root file; recurse only for older layouts.
            $rootPath = Join-Path $artifacts $Name
            if (Test-Path -LiteralPath $rootPath -PathType Leaf) {
              return (Resolve-Path -LiteralPath $rootPath).Path
            }
            $matches = @(Get-ChildItem -Path $artifacts -Recurse -File -Filter $Name)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one $Name, found $($matches.Count)"
            }
            return $matches[0].FullName
          }

          function Get-PngInfo([string]$Name) {
            $path = Get-EvidenceFile $Name
            $bytes = [IO.File]::ReadAllBytes($path)
            $signature = [byte[]](137, 80, 78, 71, 13, 10, 26, 10)

            if ($bytes.Length -lt 33) {
              throw "$Name is too small to contain a valid PNG header"
            }
            for ($i = 0; $i -lt $signature.Length; $i++) {
              if ($bytes[$i] -ne $signature[$i]) {
                throw "$Name has an invalid PNG signature"
              }
            }
            if ((Read-BigEndianUInt32 $bytes 8) -ne 13 -or
                [Text.Encoding]::ASCII.GetString($bytes, 12, 4) -ne 'IHDR') {
              throw "$Name does not begin with a valid IHDR chunk"
            }

            $width = Read-BigEndianUInt32 $bytes 16
            $height = Read-BigEndianUInt32 $bytes 20
            if ($width -lt 640 -or $height -lt 480) {
              throw "$Name has an implausibly small viewport: ${width}x${height}"
            }

            return [pscustomobject]@{
              name = $Name
              bytes = $bytes.Length
              width = $width
              height = $height
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          $frameResultPath = Get-EvidenceFile 'frame-result.txt'
          $frameResult = (Get-Content $frameResultPath -Raw).Trim()
          if ($frameResult -ne 'FRAME_INTERACTION_OK') {
            throw "Unexpected frame interaction marker: $frameResult"
          }

          $keyboardResultPath = Get-EvidenceFile 'keyboard-result.txt'
          $keyboardResult = (Get-Content $keyboardResultPath -Raw).Trim()
          if ($keyboardResult -ne 'NATIVE_KEYBOARD_OK') {
            throw "Unexpected native keyboard marker: $keyboardResult"
          }

          $caretResultPath = Get-EvidenceFile 'caret-result.txt'
          $caretResult = (Get-Content $caretResultPath -Raw).Trim()
          if ($caretResult -ne 'NATIVE_CARET_OK') {
            throw "Unexpected native pointer-caret marker: $caretResult"
          }
          $navigationResultPath = Get-EvidenceFile 'navigation-result.txt'
          $navigationResult = (Get-Content $navigationResultPath -Raw).Trim()
          if ($navigationResult -ne 'NATIVE_NAVIGATION_OK') {
            throw "Unexpected native text-navigation marker: $navigationResult"
          }

          $selectionResult = (Get-Content (Get-EvidenceFile 'selection-result.txt') -Raw).Trim()
          if ($selectionResult -ne 'NATIVE_SELECTION_HIGHLIGHT_OK') {
            throw "Unexpected native selection-highlight marker: $selectionResult"
          }
          $selectionCollapsed = Get-PngInfo 'selection-collapsed.png'
          $selectionActive = Get-PngInfo 'selection-active.png'
          if ($selectionCollapsed.sha256 -eq $selectionActive.sha256) {
            throw 'Shift+Left selection produced no visible PNG change'
          }
          Add-Type @'
          using System.Runtime.InteropServices;
          public static class LPSelectionColorProbe {
            [DllImport("user32.dll")] public static extern uint GetSysColor(int index);
          }
          '@
          $selectionColor = [LPSelectionColorProbe]::GetSysColor(13) # COLOR_HIGHLIGHT
          $selectionR = [int]($selectionColor -band 0xff)
          $selectionG = [int](($selectionColor -shr 8) -band 0xff)
          $selectionB = [int](($selectionColor -shr 16) -band 0xff)
          function Get-SelectionHighlightPixelCount([string]$Name) {
            $path = Get-EvidenceFile $Name
            $bitmap = [System.Drawing.Bitmap]::new($path)
            try {
              $count = 0
              for ($y=80; $y -lt [Math]::Min(320,$bitmap.Height); $y++) {
                for ($x=10; $x -lt [Math]::Min(520,$bitmap.Width); $x++) {
                  $pixel=$bitmap.GetPixel($x,$y)
                  if ($pixel.R -eq $selectionR -and $pixel.G -eq $selectionG -and $pixel.B -eq $selectionB) { $count++ }
                }
              }
              return $count
            } finally { $bitmap.Dispose() }
          }
          $selectionCollapsedPixels = Get-SelectionHighlightPixelCount 'selection-collapsed.png'
          $selectionActivePixels = Get-SelectionHighlightPixelCount 'selection-active.png'
          if ($selectionActivePixels -lt 80 -or $selectionActivePixels -le ($selectionCollapsedPixels + 60)) {
            throw "Native selection highlight was not visible: collapsed=$selectionCollapsedPixels active=$selectionActivePixels rgb=$selectionR,$selectionG,$selectionB"
          }

          $caretFocused = Get-PngInfo 'caret-focused.png'
          $caretBlurred = Get-PngInfo 'caret-blurred.png'
          $caretEdited = Get-PngInfo 'caret-edited.png'

          $longInputResultPath = Get-EvidenceFile 'long-input-result.txt'
          $longInputResult = (Get-Content $longInputResultPath -Raw).Trim()
          if ($longInputResult -ne 'SINGLE_LINE_INPUT_OK') {
            throw "Unexpected single-line input marker: $longInputResult"
          }
          $longInputShot = Get-PngInfo 'long-input.png'
          Add-Type -AssemblyName System.Drawing
          $longInputPath = Get-EvidenceFile 'long-input.png'
          $bitmap = [System.Drawing.Bitmap]::new($longInputPath)
          try {
            $purple = [System.Collections.Generic.List[object]]::new()
            $scanRight = [Math]::Min($bitmap.Width - 1, 300)
            $scanBottom = [Math]::Min($bitmap.Height - 1, 300)
            for ($y = 140; $y -le $scanBottom; $y++) {
              for ($x = 40; $x -le $scanRight; $x++) {
                $pixel = $bitmap.GetPixel($x, $y)
                if ($pixel.R -eq 122 -and $pixel.G -eq 31 -and $pixel.B -eq 154) {
                  $purple.Add([pscustomobject]@{ x = $x; y = $y })
                }
              }
            }
            if ($purple.Count -lt 100) { throw 'Could not locate the long-input purple border in PNG evidence' }
            $x0 = ($purple.x | Measure-Object -Minimum).Minimum
            $x1 = ($purple.x | Measure-Object -Maximum).Maximum
            $y0 = ($purple.y | Measure-Object -Minimum).Minimum
            $y1 = ($purple.y | Measure-Object -Maximum).Maximum
            $darkRows = [System.Collections.Generic.List[int]]::new()
            for ($y = $y0 + 3; $y -le $y1 - 3; $y++) {
              $dark = 0
              for ($x = $x0 + 3; $x -le $x1 - 3; $x++) {
                $pixel = $bitmap.GetPixel($x, $y)
                if ($pixel.R -lt 100 -and $pixel.G -lt 100 -and $pixel.B -lt 100) { $dark++ }
              }
              if ($dark -gt 0) { $darkRows.Add($y) }
            }
            $longInputBands = 0
            $previous = -2
            foreach ($row in $darkRows) {
              if ($row -gt $previous + 1) { $longInputBands++ }
              $previous = $row
            }
            if ($longInputBands -ne 1) {
              throw "Long single-line input painted $longInputBands dark text bands; expected exactly one"
            }
          } finally {
            $bitmap.Dispose()
          }
          if ($caretFocused.sha256 -eq $caretBlurred.sha256) {
            throw 'Focused input did not visibly expose a native caret'
          }
          if ($caretEdited.sha256 -eq $caretBlurred.sha256) {
            throw 'Edited focused input did not visibly expose a native caret'
          }

          $bootstrapResultPath = Get-EvidenceFile 'bootstrap-result.txt'
          $bootstrapResult = (Get-Content $bootstrapResultPath -Raw).Trim()
          if ($bootstrapResult -ne 'GOOGLE_BOOTSTRAP_OK') {
            throw "Unexpected Google-style bootstrap marker: $bootstrapResult"
          }
          $bootstrapShot = Get-PngInfo 'bootstrap-after.png'

          $googleLayoutResultPath = Get-EvidenceFile 'google-layout-result.txt'
          $googleLayoutResult = (Get-Content $googleLayoutResultPath -Raw).Trim()
          if ($googleLayoutResult -ne 'GOOGLE_LAYOUT_OK') {
            throw "Unexpected Google-layout marker: $googleLayoutResult"
          }
          $googleLayoutShot = Get-PngInfo 'google-layout.png'
          $googleGeometryPath = Get-EvidenceFile 'google-layout-geometry.json'
          $googleGeometry = Get-Content $googleGeometryPath -Raw | ConvertFrom-Json
          foreach ($property in @('header_width','header_height','search_x','search_y','search_width','search_height','actions_x','actions_width','tabs_y','tabs_height','results_x','results_y','results_width')) {
            if ($null -eq $googleGeometry.PSObject.Properties[$property]) { throw "google-layout-geometry.json is missing $property" }
          }
          if ([double]$googleGeometry.header_width -lt 1180) { throw "Google-like header collapsed to $($googleGeometry.header_width)px" }
          if ([double]$googleGeometry.search_width -lt 670 -or [double]$googleGeometry.search_width -gt 710) { throw "Google-like search box width is $($googleGeometry.search_width)px" }
          if ([double]$googleGeometry.actions_x -lt 1080) { throw "Google-like right actions did not stay right-aligned: x=$($googleGeometry.actions_x)" }
          if ([double]$googleGeometry.results_x -lt 130 -or [double]$googleGeometry.results_x -gt 180) { throw "Google-like results column drifted: x=$($googleGeometry.results_x)" }

          # Pixel oracle: locate the exact Google-blue search-shell border and
          # reject a wrapped/collapsed/vertically exploded search control.
          Add-Type -AssemblyName System.Drawing
          $googleLayoutPath = Get-EvidenceFile 'google-layout.png'
          $googleBitmap = [System.Drawing.Bitmap]::new($googleLayoutPath)
          try {
            $blue = [System.Collections.Generic.List[object]]::new()
            for ($y = 90; $y -le [Math]::Min($googleBitmap.Height - 1, 260); $y++) {
              for ($x = 80; $x -le [Math]::Min($googleBitmap.Width - 1, 980); $x++) {
                $pixel = $googleBitmap.GetPixel($x, $y)
                if ($pixel.R -eq 66 -and $pixel.G -eq 133 -and $pixel.B -eq 244) { $blue.Add([pscustomobject]@{ x = $x; y = $y }) }
              }
            }
            if ($blue.Count -lt 400) { throw 'Could not locate enough Google-blue search-border pixels in google-layout.png' }
            $googleBlueX0 = ($blue.x | Measure-Object -Minimum).Minimum
            $googleBlueX1 = ($blue.x | Measure-Object -Maximum).Maximum
            $googleBlueY0 = ($blue.y | Measure-Object -Minimum).Minimum
            $googleBlueY1 = ($blue.y | Measure-Object -Maximum).Maximum
            $googleBlueWidth = $googleBlueX1 - $googleBlueX0 + 1
            $googleBlueHeight = $googleBlueY1 - $googleBlueY0 + 1
            if ($googleBlueWidth -lt 650 -or $googleBlueWidth -gt 740) { throw "Google search border pixel width is $googleBlueWidth" }
            if ($googleBlueHeight -lt 40 -or $googleBlueHeight -gt 60) { throw "Google search border pixel height is $googleBlueHeight" }
          } finally {
            $googleBitmap.Dispose()
          }

          $wikipediaPortalResultPath = Get-EvidenceFile 'wikipedia-portal-result.txt'
          $wikipediaPortalResult = (Get-Content $wikipediaPortalResultPath -Raw).Trim()
          if ($wikipediaPortalResult -ne 'WIKIPEDIA_PORTAL_OK') {
            throw "Unexpected Wikipedia portal marker: $wikipediaPortalResult"
          }
          $wikipediaPortalShot = Get-PngInfo 'wikipedia-portal.png'
          $wikipediaPortalGeometryPath = Get-EvidenceFile 'wikipedia-portal-geometry.json'
          $wikipediaPortalGeometry = Get-Content $wikipediaPortalGeometryPath -Raw | ConvertFrom-Json
          foreach ($property in @('ring_x','ring_y','ring_w','ring_h','l1_x','l1_y','l1_w','l1_h','l2_x','l2_y','l5_y','l10_y','search_w','search_h','root_fs')) {
            if ($null -eq $wikipediaPortalGeometry.PSObject.Properties[$property]) { throw "wikipedia-portal-geometry.json is missing $property" }
          }
          if ([double]$wikipediaPortalGeometry.ring_w -lt 540 -or [double]$wikipediaPortalGeometry.ring_w -gt 552) { throw "Wikipedia portal ring width is $($wikipediaPortalGeometry.ring_w)px" }
          if ([double]$wikipediaPortalGeometry.ring_h -lt 320 -or [double]$wikipediaPortalGeometry.ring_h -gt 330) { throw "Wikipedia portal ring height is $($wikipediaPortalGeometry.ring_h)px" }
          if ([double]$wikipediaPortalGeometry.l1_w -lt 150 -or [double]$wikipediaPortalGeometry.l1_w -gt 162) { throw "Wikipedia language-card width is $($wikipediaPortalGeometry.l1_w)px" }
          if ([double]$wikipediaPortalGeometry.l1_h -lt 38 -or [double]$wikipediaPortalGeometry.l1_h -gt 42) { throw "Wikipedia language-card height is $($wikipediaPortalGeometry.l1_h)px" }
          $wikiL5Offset = [double]$wikipediaPortalGeometry.l5_y - [double]$wikipediaPortalGeometry.ring_y
          $wikiL10Offset = [double]$wikipediaPortalGeometry.l10_y - [double]$wikipediaPortalGeometry.ring_y
          if ($wikiL5Offset -lt 126 -or $wikiL5Offset -gt 134) { throw "Wikipedia 40% language row offset is $wikiL5Offset px" }
          if ($wikiL10Offset -lt 256 -or $wikiL10Offset -gt 264) { throw "Wikipedia 80% language row offset is $wikiL10Offset px" }
          if ([double]$wikipediaPortalGeometry.search_w -lt 536 -or [double]$wikipediaPortalGeometry.search_w -gt 544) { throw "Wikipedia portal search width is $($wikipediaPortalGeometry.search_w)px" }
          if ([double]$wikipediaPortalGeometry.search_h -lt 42 -or [double]$wikipediaPortalGeometry.search_h -gt 46) { throw "Wikipedia portal search height is $($wikipediaPortalGeometry.search_h)px" }
          if ([string]$wikipediaPortalGeometry.root_fs -ne '62.5%') { throw "Wikipedia root font-size serialization changed: $($wikipediaPortalGeometry.root_fs)" }

          $wikipediaSearchResultPath = Get-EvidenceFile 'wikipedia-search-result.txt'
          $wikipediaSearchResult = (Get-Content $wikipediaSearchResultPath -Raw).Trim()
          if ($wikipediaSearchResult -ne 'WIKIPEDIA_SEARCH_OK') {
            throw "Unexpected Wikipedia search marker: $wikipediaSearchResult"
          }
          $wikipediaSearchShot = Get-PngInfo 'wikipedia-search.png'
          $wikipediaSearchGeometryPath = Get-EvidenceFile 'wikipedia-search-geometry.json'
          $wikipediaSearchGeometry = Get-Content $wikipediaSearchGeometryPath -Raw | ConvertFrom-Json
          foreach ($property in @('search-container_w','search-input_x','search-input_y','search-input_w','search-input_h','searchInput_w','searchInput_h','search-button_x','search-button_y','search-button_w','search-button_h','search-icon_w','search-icon_h','root_progressive')) {
            if ($null -eq $wikipediaSearchGeometry.PSObject.Properties[$property]) { throw "wikipedia-search-geometry.json is missing $property" }
          }
          if ([double]$wikipediaSearchGeometry.'search-container_w' -lt 536 -or [double]$wikipediaSearchGeometry.'search-container_w' -gt 544) { throw "Wikipedia search container width is $($wikipediaSearchGeometry.'search-container_w')px" }
          if ([double]$wikipediaSearchGeometry.'search-input_w' -lt 390 -or [double]$wikipediaSearchGeometry.'search-input_w' -gt 398) { throw "Wikipedia search wrapper width is $($wikipediaSearchGeometry.'search-input_w')px" }
          if ([double]$wikipediaSearchGeometry.'search-input_h' -lt 42 -or [double]$wikipediaSearchGeometry.'search-input_h' -gt 46) { throw "Wikipedia search wrapper height is $($wikipediaSearchGeometry.'search-input_h')px" }
          if ([double]$wikipediaSearchGeometry.'searchInput_w' -lt 390 -or [double]$wikipediaSearchGeometry.'searchInput_w' -gt 398) { throw "Wikipedia input width is $($wikipediaSearchGeometry.'searchInput_w')px" }
          if ([double]$wikipediaSearchGeometry.'searchInput_h' -lt 42 -or [double]$wikipediaSearchGeometry.'searchInput_h' -gt 46) { throw "Wikipedia input height is $($wikipediaSearchGeometry.'searchInput_h')px" }
          if ([double]$wikipediaSearchGeometry.'search-button_w' -lt 50 -or [double]$wikipediaSearchGeometry.'search-button_w' -gt 58) { throw "Wikipedia search button width is $($wikipediaSearchGeometry.'search-button_w')px" }
          if ([double]$wikipediaSearchGeometry.'search-button_h' -lt 42 -or [double]$wikipediaSearchGeometry.'search-button_h' -gt 46) { throw "Wikipedia search button height is $($wikipediaSearchGeometry.'search-button_h')px" }
          if ([double]$wikipediaSearchGeometry.'search-icon_w' -lt 20 -or [double]$wikipediaSearchGeometry.'search-icon_w' -gt 24) { throw "Wikipedia search icon width is $($wikipediaSearchGeometry.'search-icon_w')px" }
          if ([double]$wikipediaSearchGeometry.'search-icon_h' -lt 20 -or [double]$wikipediaSearchGeometry.'search-icon_h' -gt 24) { throw "Wikipedia search icon height is $($wikipediaSearchGeometry.'search-icon_h')px" }
          if ([string]$wikipediaSearchGeometry.root_progressive -ne '#36c') { throw "Wikipedia :root custom property did not resolve: $($wikipediaSearchGeometry.root_progressive)" }
          if ([double]$wikipediaSearchGeometry.'search-button_x' -lt ([double]$wikipediaSearchGeometry.'search-input_x' + [double]$wikipediaSearchGeometry.'search-input_w')) { throw 'Wikipedia search button overlaps the input' }

          $wikipediaSearchPath = Get-EvidenceFile 'wikipedia-search.png'
          $wikipediaBitmap = [System.Drawing.Bitmap]::new($wikipediaSearchPath)
          try {
            $wikiBlue = [System.Collections.Generic.List[object]]::new()
            for ($y = 0; $y -lt $wikipediaBitmap.Height; $y++) {
              for ($x = 0; $x -lt $wikipediaBitmap.Width; $x++) {
                $pixel = $wikipediaBitmap.GetPixel($x, $y)
                if ($pixel.R -eq 51 -and $pixel.G -eq 102 -and $pixel.B -eq 204) { $wikiBlue.Add([pscustomobject]@{ x = $x; y = $y }) }
              }
