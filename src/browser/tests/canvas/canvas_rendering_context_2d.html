<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=CanvasRenderingContext2D>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  const ctx2 = element.getContext("2d");
  testing.expectEqual(true, ctx instanceof CanvasRenderingContext2D);
  testing.expectEqual(true, ctx === ctx2);
  testing.expectEqual(null, element.getContext("webgl"));
  ctx.fillRect(0, 0, 0, 0);
}
</script>

<script id=CanvasRenderingContext2D#fillStyle>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  // Black by default.
  testing.expectEqual(ctx.fillStyle, "#000000");
  ctx.fillStyle = "red";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "rebeccapurple";
  testing.expectEqual(ctx.fillStyle, "#663399");
  // No changes made if color is invalid.
  ctx.fillStyle = "invalid-color";
  testing.expectEqual(ctx.fillStyle, "#663399");
  ctx.fillStyle = "#fc0";
  testing.expectEqual(ctx.fillStyle, "#ffcc00");
  ctx.fillStyle = "#ff0000";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "#fF00000F";
  testing.expectEqual(ctx.fillStyle, "rgba(255, 0, 0, 0.06)");
}
</script>

<script id="CanvasRenderingContext2D#createImageData(width, height)">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(100, 200);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 100);
  testing.expectEqual(imageData.height, 200);
  testing.expectEqual(imageData.data.length, 100 * 200 * 4);
  testing.expectEqual(true, imageData.data instanceof Uint8ClampedArray);

  // All pixels should be initialized to 0.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);
}
</script>

<script id="CanvasRenderingContext2D#createImageData(imageData)">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const source = ctx.createImageData(50, 75);
  const imageData = ctx.createImageData(source);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 50);
  testing.expectEqual(imageData.height, 75);
  testing.expectEqual(imageData.data.length, 50 * 75 * 4);
}
</script>

<script id="CanvasRenderingContext2D#putImageData">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(10, 10);
  testing.expectEqual(true, imageData instanceof ImageData);
  // Modify some pixel data.
  imageData.data[0] = 255;
  imageData.data[1] = 0;
  imageData.data[2] = 0;
  imageData.data[3] = 255;

  // putImageData should not throw.
  ctx.putImageData(imageData, 0, 0);
  ctx.putImageData(imageData, 10, 20);
  // With dirty rect parameters.
  ctx.putImageData(imageData, 0, 0, 0, 0, 5, 5);
}
</script>

<script id="CanvasRenderingContext2D#getImageData">
{
  const element = document.createElement("canvas");
  element.width = 100;
  element.height = 50;
  const ctx = element.getContext("2d");

  const imageData = ctx.getImageData(0, 0, 10, 20);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 10);
  testing.expectEqual(imageData.height, 20);
  testing.expectEqual(imageData.data.length, 10 * 20 * 4);
  testing.expectEqual(true, imageData.data instanceof Uint8ClampedArray);

  // Undrawn canvas should return transparent black pixels.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);
}
</script>

<script id="CanvasRenderingContext2D#getImageData invalid">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  // Zero or negative width/height should throw IndexSizeError.
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 0, 10));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 10, 0));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, -5, 10));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 10, -5));
}
</script>

<script id="CanvasRenderingContext2D#drawImage(HTMLCanvasElement, dx, dy)">
{
  const source = document.createElement("canvas");
  source.width = 2;
  source.height = 1;
  const sourceCtx = source.getContext("2d");
  const image = sourceCtx.createImageData(2, 1);
  image.data[0] = 255;
  image.data[3] = 255;
  image.data[4] = 0;
  image.data[5] = 0;
  image.data[6] = 255;
  image.data[7] = 255;
  sourceCtx.putImageData(image, 0, 0);

  const target = document.createElement("canvas");
  target.width = 8;
  target.height = 8;
  const ctx = target.getContext("2d");
  ctx.drawImage(source, 3, 4);

  const sample = ctx.getImageData(3, 4, 2, 1);
  testing.expectEqual(255, sample.data[0]);
  testing.expectEqual(0, sample.data[1]);
  testing.expectEqual(0, sample.data[2]);
  testing.expectEqual(255, sample.data[3]);
  testing.expectEqual(0, sample.data[4]);
  testing.expectEqual(0, sample.data[5]);
  testing.expectEqual(255, sample.data[6]);
  testing.expectEqual(255, sample.data[7]);
}
</script>

<script id="CanvasRenderingContext2D#drawImage(HTMLCanvasElement, dx, dy, dWidth, dHeight)">
{
  const source = document.createElement("canvas");
  source.width = 2;
  source.height = 1;
  const sourceCtx = source.getContext("2d");
  const image = sourceCtx.createImageData(2, 1);
  image.data[0] = 255;
  image.data[3] = 255;
  image.data[4] = 0;
  image.data[5] = 0;
  image.data[6] = 255;
  image.data[7] = 255;
  sourceCtx.putImageData(image, 0, 0);

  const target = document.createElement("canvas");
  target.width = 8;
  target.height = 8;
  const ctx = target.getContext("2d");
  ctx.drawImage(source, 1, 2, 4, 2);

  const left = ctx.getImageData(1, 2, 1, 1).data;
  const right = ctx.getImageData(4, 2, 1, 1).data;
  testing.expectEqual(255, left[0]);
  testing.expectEqual(0, left[2]);
  testing.expectEqual(0, right[0]);
  testing.expectEqual(255, right[2]);
}
</script>

<script id="CanvasRenderingContext2D#drawImage(HTMLImageElement)">
{
  const img = new Image();
  img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADklEQVR42mP4z8AAQv8BD/kD/Zh51wAAAAAASUVORK5CYII=';

  const target = document.createElement("canvas");
  target.width = 8;
  target.height = 8;
  const ctx = target.getContext("2d");
  ctx.drawImage(img, 1, 2);
  ctx.drawImage(img, 1, 0, 1, 1, 4, 1, 2, 2);

  testing.expectEqual(2, img.naturalWidth);
  testing.expectEqual(1, img.naturalHeight);

  const left = ctx.getImageData(1, 2, 1, 1).data;
  const right = ctx.getImageData(2, 2, 1, 1).data;
  const cropped = ctx.getImageData(4, 1, 1, 1).data;
  testing.expectEqual(255, left[0]);
  testing.expectEqual(0, left[2]);
  testing.expectEqual(0, right[0]);
  testing.expectEqual(255, right[2]);
  testing.expectEqual(0, cropped[0]);
  testing.expectEqual(255, cropped[2]);
}
</script>

<script id="CanvasRenderingContext2D#path fill and stroke">
{
  const element = document.createElement("canvas");
  element.width = 10;
  element.height = 10;
  const ctx = element.getContext("2d");

  ctx.beginPath();
  ctx.moveTo(1, 1);
  ctx.lineTo(7, 1);
  ctx.lineTo(4, 6);
  ctx.closePath();
  ctx.fillStyle = "#00ff00";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(1, 8);
  ctx.lineTo(8, 8);
  ctx.lineTo(8, 3);
  ctx.strokeStyle = "#0000ff";
  ctx.stroke();

  const filled = ctx.getImageData(4, 3, 1, 1).data;
  const horizontal = ctx.getImageData(3, 8, 1, 1).data;
  const vertical = ctx.getImageData(8, 5, 1, 1).data;
  testing.expectEqual(0, filled[0]);
  testing.expectEqual(255, filled[1]);
  testing.expectEqual(0, filled[2]);
  testing.expectEqual(0, horizontal[0]);
  testing.expectEqual(0, horizontal[1]);
  testing.expectEqual(255, horizontal[2]);
  testing.expectEqual(0, vertical[0]);
  testing.expectEqual(0, vertical[1]);
  testing.expectEqual(255, vertical[2]);
}
</script>

<script id="CanvasRenderingContext2D#font and text state">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual("10px sans-serif", ctx.font);
  testing.expectEqual("start", ctx.textAlign);
  testing.expectEqual("alphabetic", ctx.textBaseline);

  ctx.font = 'italic 700 24px "Times New Roman"';
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  testing.expectEqual('italic 700 24px "Times New Roman"', ctx.font);
  testing.expectEqual("center", ctx.textAlign);
  testing.expectEqual("top", ctx.textBaseline);
}
</script>

<script id="CanvasRenderingContext2D#fillText draws pixels">
{
  const element = document.createElement("canvas");
  element.width = 160;
  element.height = 80;
  const ctx = element.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, 160, 80);
  ctx.fillStyle = "#ff0000";
  ctx.font = "32px Arial";
  ctx.textBaseline = "top";
  ctx.fillText("HI", 10, 10);

  const image = ctx.getImageData(0, 0, 160, 80).data;
  let redPixels = 0;
  for (let i = 0; i < image.length; i += 4) {
    if (image[i] > 160 && image[i + 1] < 80 && image[i + 2] < 80 && image[i + 3] > 0) {
      redPixels++;
    }
  }
  testing.expectEqual(true, redPixels > 40);
}
</script>

<script id="CanvasRenderingContext2D#strokeText draws pixels">
{
  const element = document.createElement("canvas");
  element.width = 160;
  element.height = 80;
  const ctx = element.getContext("2d");
  ctx.strokeStyle = "#0000ff";
  ctx.font = "28px Arial";
  ctx.textBaseline = "top";
  ctx.strokeText("OK", 10, 10);

  const image = ctx.getImageData(0, 0, 160, 80).data;
  let bluePixels = 0;
  for (let i = 0; i < image.length; i += 4) {
    if (image[i] < 100 && image[i + 1] < 100 && image[i + 2] > 120 && image[i + 3] > 0) {
      bluePixels++;
    }
  }
  testing.expectEqual(true, bluePixels > 40);
}
</script>

<script id="CanvasRenderingContext2D#drawImage(HTMLCanvasElement, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)">
{
  const source = document.createElement("canvas");
  source.width = 3;
  source.height = 1;
  const sourceCtx = source.getContext("2d");
  const image = sourceCtx.createImageData(3, 1);
  image.data[0] = 255;
  image.data[3] = 255;
  image.data[4] = 0;
  image.data[5] = 255;
  image.data[7] = 255;
  image.data[8] = 0;
  image.data[10] = 255;
  image.data[11] = 255;
  sourceCtx.putImageData(image, 0, 0);

  const target = document.createElement("canvas");
  target.width = 8;
  target.height = 8;
  const ctx = target.getContext("2d");
  ctx.drawImage(source, 1, 0, 1, 1, 0, 0, 2, 2);

  const sample = ctx.getImageData(1, 1, 1, 1).data;
  testing.expectEqual(0, sample[0]);
  testing.expectEqual(255, sample[1]);
  testing.expectEqual(0, sample[2]);
  testing.expectEqual(255, sample[3]);
}
</script>


<script id="CanvasRenderingContext2D#canvas">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual(ctx.canvas, element);
  // Setting dimensions via ctx.canvas should update the element.
  ctx.canvas.width = 40;
  ctx.canvas.height = 25;
  testing.expectEqual(element.width, 40);
  testing.expectEqual(element.height, 25);
}
</script>

<script id="getter">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual('10px sans-serif', ctx.font);
  ctx.font = 'bold 48px serif'
  testing.expectEqual('bold 48px serif', ctx.font);

}
</script>

<script id=identity>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('2d');

  testing.expectTrue(ctx === element.getContext('2d'));
  testing.expectEqual(null, element.getContext('webgl'));
}
</script>

<script id="CanvasRenderingContext2D#drawImage">
{
  const ctx = document.createElement('canvas').getContext('2d');
  const img = new Image();
  const src = document.createElement('canvas');
  // No-op, but must accept the (image, dx, dy), (image, dx, dy, dw, dh) and
  // 9-arg overloads without throwing.
  ctx.drawImage(img, 0, 0);
  ctx.drawImage(src, 0, 0, 10, 10);
  testing.expectEqual(undefined, ctx.drawImage(src, 0, 0, 10, 10, 0, 0, 10, 10));
}
</script>
