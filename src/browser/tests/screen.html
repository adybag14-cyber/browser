<!DOCTYPE html>
<script src="testing.js"></script>

<script id=screen_exists>
  testing.expectEqual(true, screen !== undefined);
  testing.expectEqual(true, screen !== null);
  testing.expectEqual(true, window.screen === screen);
</script>

<script id=screen_dimensions_are_numbers>
  testing.expectEqual('number', typeof screen.width);
  testing.expectEqual('number', typeof screen.height);
  testing.expectEqual('number', typeof screen.availWidth);
  testing.expectEqual('number', typeof screen.availHeight);
  testing.expectEqual(true, screen.width > 0);
  testing.expectEqual(true, screen.height > 0);
  testing.expectEqual(true, screen.availWidth > 0);
  testing.expectEqual(true, screen.availHeight > 0);
</script>

<script id=screen_position_defaults>
  testing.expectEqual('number', typeof screen.availLeft);
  testing.expectEqual('number', typeof screen.availTop);
  testing.expectEqual(0, screen.availLeft);
  testing.expectEqual(0, screen.availTop);
</script>

<script id=screen_depth_and_extension_defaults>
  testing.expectEqual(24, screen.colorDepth);
  testing.expectEqual(24, screen.pixelDepth);
  testing.expectEqual('boolean', typeof screen.isExtended);
  testing.expectEqual(false, screen.isExtended);
</script>

<script id=screen_orientation_exists>
  testing.expectEqual(true, screen.orientation !== undefined);
  testing.expectEqual(true, screen.orientation !== null);
  testing.expectEqual(true, screen.orientation === screen.orientation);
</script>

<script id=screen_orientation_defaults>
  const expectedType = screen.height > screen.width ? 'portrait-primary' : 'landscape-primary';
  testing.expectEqual('number', typeof screen.orientation.angle);
  testing.expectEqual('string', typeof screen.orientation.type);
  testing.expectEqual(0, screen.orientation.angle);
  testing.expectEqual(expectedType, screen.orientation.type);
</script>
