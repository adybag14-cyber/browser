<!DOCTYPE html>
<script src="../testing.js"></script>

<style>
.computed-sheet-rule {
  width: 304px;
  height: 78px;
  display: flex;
  color: rgb(12, 34, 56);
  background-color: rgb(240, 241, 242);
}
#computed-sheet-target { width: 320px; }
.computed-sheet-important { color: green !important; }
.computed-sheet-shorthand { background: #aabbcc; border: 3px solid #445566; }
</style>

<div id="test-div"></div>

<script id="styles">
{
  const div = $('#test-div');
  div.style.cssText = '';

  testing.expectEqual(0, div.style.length);
  testing.expectEqual('', div.style.cssText);

  div.style.setProperty('color', 'red');
  testing.expectEqual('red', div.style.getPropertyValue('color'));
  testing.expectEqual('', div.style.getPropertyPriority('color'));
  testing.expectEqual(1, div.style.length);

  div.style.setProperty('background-color', 'blue', 'important');
  testing.expectEqual('blue', div.style.getPropertyValue('background-color'));
  testing.expectEqual('important', div.style.getPropertyPriority('background-color'));
  testing.expectEqual(2, div.style.length);

  testing.expectEqual('blue', div.style.getPropertyValue('BACKGROUND-COLOR'));
  testing.expectEqual('blue', div.style.getPropertyValue('Background-Color'));

  div.style.setProperty('font-size', '16px');
  testing.expectEqual('16px', div.style.getPropertyValue('font-size'));
  testing.expectEqual(3, div.style.length);

  const cssText = div.style.cssText;
  testing.expectEqual(true, cssText.includes('color: red;'));
  testing.expectEqual(true, cssText.includes('background-color: blue !important;'));
  testing.expectEqual(true, cssText.includes('font-size: 16px;'));

  const removedValue = div.style.removeProperty('color');
  testing.expectEqual('red', removedValue);
  testing.expectEqual('', div.style.getPropertyValue('color'));
  testing.expectEqual(2, div.style.length);

  const notFound = div.style.removeProperty('non-existent');
  testing.expectEqual('', notFound);
  testing.expectEqual(2, div.style.length);

  const prop0 = div.style.item(0);
  const prop1 = div.style.item(1);
  testing.expectEqual(true, prop0 === 'background-color' || prop0 === 'font-size');
  testing.expectEqual(true, prop1 === 'background-color' || prop1 === 'font-size');
  testing.expectEqual(true, prop0 !== prop1);
  testing.expectEqual('', div.style.item(2));
  testing.expectEqual('', div.style.item(-1));
}
</script>

<script id="cssText">
{
  const div = $('#test-div');

  div.style.cssText = '';
  testing.expectEqual(0, div.style.length);
  testing.expectEqual('', div.style.cssText);

  div.style.cssText = 'width: 100px; height: 50px !important; margin-top: 10px';
  testing.expectEqual(3, div.style.length);
  testing.expectEqual('100px', div.style.getPropertyValue('width'));
  testing.expectEqual('50px', div.style.getPropertyValue('height'));
  testing.expectEqual('10px', div.style.getPropertyValue('margin-top'));
  testing.expectEqual('', div.style.getPropertyPriority('width'));
  testing.expectEqual('important', div.style.getPropertyPriority('height'));
  testing.expectEqual('', div.style.getPropertyPriority('margin-top'));

  div.style.cssText = '  padding-left:  5px  ;  border-top-width: 1px  ';
  testing.expectEqual(2, div.style.length);
  testing.expectEqual('5px', div.style.getPropertyValue('padding-left'));
  testing.expectEqual('1px', div.style.getPropertyValue('border-top-width'));

  div.style.cssText = '';
  testing.expectEqual(0, div.style.length);
  testing.expectEqual('', div.style.cssText);

  div.style.cssText = 'color: red;';
  testing.expectEqual(1, div.style.length);
  testing.expectEqual('red', div.style.getPropertyValue('color'));
}
</script>

<script id="propertyUpdates">
{
  const div = $('#test-div');
  div.style.cssText = '';

  div.style.setProperty('color', 'red');
  testing.expectEqual('red', div.style.getPropertyValue('color'));
  testing.expectEqual(1, div.style.length);

  div.style.setProperty('color', 'blue');
  testing.expectEqual('blue', div.style.getPropertyValue('color'));
  testing.expectEqual(1, div.style.length);

  div.style.setProperty('color', 'green', 'important');
  testing.expectEqual('green', div.style.getPropertyValue('color'));
  testing.expectEqual('important', div.style.getPropertyPriority('color'));
  testing.expectEqual(1, div.style.length);

  div.style.setProperty('color', 'yellow');
  testing.expectEqual('yellow', div.style.getPropertyValue('color'));
  testing.expectEqual('', div.style.getPropertyPriority('color'));
  testing.expectEqual(1, div.style.length);

  div.style.setProperty('color', '');
  testing.expectEqual('', div.style.getPropertyValue('color'));
  testing.expectEqual(0, div.style.length);
}
</script>

<script id="invalidPriority">
{
  const div = $('#test-div');
  div.style.cssText = '';

  div.style.setProperty('color', 'red', 'invalid');
  testing.expectEqual('', div.style.getPropertyValue('color'));
  testing.expectEqual(0, div.style.length);

  div.style.setProperty('color', 'red', 'important');
  testing.expectEqual('red', div.style.getPropertyValue('color'));
  testing.expectEqual('important', div.style.getPropertyPriority('color'));
}
</script>

<script id="defaultVisibilityProperties">
{
  // Test that inline styles return empty string when not explicitly set
  const div = document.createElement('div');
  const span = document.createElement('span');
  const anchor = document.createElement('a');

  // Test that element.style returns empty for unset properties
  testing.expectEqual('', div.style.getPropertyValue('display'));
  testing.expectEqual('', span.style.getPropertyValue('display'));
  testing.expectEqual('', anchor.style.getPropertyValue('display'));

  // Test visibility - also returns empty when not set
  testing.expectEqual('', div.style.getPropertyValue('visibility'));

  // Test opacity - also returns empty when not set
  testing.expectEqual('', div.style.getPropertyValue('opacity'));

  // Test that explicit values can be set
  div.style.setProperty('display', 'flex');
  testing.expectEqual('flex', div.style.getPropertyValue('display'));
  testing.expectEqual(1, div.style.length);

  // Test that removing property returns to empty string
  div.style.setProperty('display', '');
  testing.expectEqual('', div.style.getPropertyValue('display'));
  testing.expectEqual(0, div.style.length);

  // Test that other properties also return empty when not set
  testing.expectEqual('', div.style.getPropertyValue('color'));
  testing.expectEqual('', div.style.getPropertyValue('width'));
}
</script>

<script id="computedStyleDefaults">
{
  // Test that getComputedStyle returns default visibility properties
  const div = document.createElement('div');
  const span = document.createElement('span');
  const anchor = document.createElement('a');
  document.body.appendChild(div);
  document.body.appendChild(span);
  document.body.appendChild(anchor);

  // Test element.style returns empty when not explicitly set
  testing.expectEqual('', div.style.display);
  testing.expectEqual('', span.style.display);
  testing.expectEqual('', anchor.style.display);
  testing.expectEqual('', div.style.visibility);
  testing.expectEqual('', div.style.opacity);

  // Test getComputedStyle with getPropertyValue
  const divStyle = window.getComputedStyle(div);
  const spanStyle = window.getComputedStyle(span);
  const anchorStyle = window.getComputedStyle(anchor);

  testing.expectEqual('block', divStyle.getPropertyValue('display'));
  testing.expectEqual('inline', spanStyle.getPropertyValue('display'));
  testing.expectEqual('inline', anchorStyle.getPropertyValue('display'));
  testing.expectEqual('visible', divStyle.getPropertyValue('visibility'));
  testing.expectEqual('1', divStyle.getPropertyValue('opacity'));

  // Test getComputedStyle with named property access (camelCase)
  testing.expectEqual('block', divStyle.display);
  testing.expectEqual('inline', spanStyle.display);
  testing.expectEqual('inline', anchorStyle.display);
  testing.expectEqual('visible', divStyle.visibility);
  testing.expectEqual('1', divStyle.opacity);
}
</script>

<script id="computedStyleInline">
{
  const div = document.createElement('div');
  div.style.cssText = 'text-transform: uppercase; font-weight: 700; color: rgb(1, 2, 3)';
  document.body.appendChild(div);

  const cs = window.getComputedStyle(div);
  testing.expectEqual('uppercase', cs.getPropertyValue('text-transform'));
  testing.expectEqual('700', cs.getPropertyValue('font-weight'));
  testing.expectEqual('rgb(1, 2, 3)', cs.getPropertyValue('color'));
  testing.expectEqual('rgb(1, 2, 3)', div.style.getPropertyValue('color'));
  testing.expectEqual('', cs.getPropertyValue('letter-spacing'));

  const plainDiv = document.createElement('div');
  document.body.appendChild(plainDiv);
  testing.expectEqual('block', window.getComputedStyle(plainDiv).getPropertyValue('display'));

  // Repeated calls return the same object (as in Chrome); distinct per element.
  testing.expectTrue(window.getComputedStyle(div) === window.getComputedStyle(div));
  testing.expectTrue(window.getComputedStyle(div) === cs);
  testing.expectFalse(window.getComputedStyle(div) === window.getComputedStyle(plainDiv));
  // The cached object stays a live view.
  div.style.setProperty('text-transform', 'lowercase');
  testing.expectEqual('lowercase', window.getComputedStyle(div).getPropertyValue('text-transform'));

  // Pseudo-elements get their own cache entry, keyed per (element, pseudo);
  // the legacy single-colon form maps to the same entry as the double-colon
  // one, and a pseudoElt without a leading colon is ignored (CSSOM).
  const before = window.getComputedStyle(div, ':before');
  testing.expectTrue(before === window.getComputedStyle(div, '::before'));
  testing.expectTrue(before === window.getComputedStyle(div, ':BEFORE'));
  testing.expectFalse(before === cs);
  testing.expectFalse(before === window.getComputedStyle(div, '::after'));
  testing.expectTrue(cs === window.getComputedStyle(div, 'before'));
  testing.expectTrue(cs === window.getComputedStyle(div, ''));

  // A normal declaration must not override an earlier !important one, and the
  // computed and inline (el.style) paths must agree on the resolved value.
  const impDiv = document.createElement('div');
  impDiv.setAttribute('style', 'color: red !important; color: blue');
  document.body.appendChild(impDiv);
  testing.expectEqual('red', window.getComputedStyle(impDiv).getPropertyValue('color'));
  testing.expectEqual('red', impDiv.style.getPropertyValue('color'));
}
</script>

<script id="computedStyleUaDisplayDefaults">
{
  const cases = [['input','inline-block'],['button','inline-block'],['select','inline-block'],['textarea','inline-block'],['meter','inline-block'],['progress','inline-block'],['img','inline'],['table','table'],['col','table-column'],['colgroup','table-column-group'],['tr','table-row'],['td','table-cell'],['li','list-item'],['script','none']];
  for (const [tag, expected] of cases) {
    const el = document.createElement(tag);
    if (tag === 'tr') { const table=document.createElement('table'); table.appendChild(el); document.body.appendChild(table); }
    else if (tag === 'td') { const table=document.createElement('table'); const row=document.createElement('tr'); row.appendChild(el); table.appendChild(row); document.body.appendChild(table); }
    else document.body.appendChild(el);
    testing.expectEqual(expected, getComputedStyle(el).getPropertyValue('display'));
  }
  const hidden = document.createElement('input'); hidden.type = 'hidden'; document.body.appendChild(hidden); testing.expectEqual('none', getComputedStyle(hidden).getPropertyValue('display'));
}
</script>

<script id="computedStyleStylesheetCascade">
{
  const target = document.createElement('div');
  target.id = 'computed-sheet-target';
  target.setAttribute('class', 'computed-sheet-rule');
  document.body.appendChild(target);

  const cs = window.getComputedStyle(target);
  // Non-visibility stylesheet declarations must participate in computed style.
  // The id selector also proves the existing specificity/source-order index is
  // reused instead of merely returning the first matching class declaration.
  testing.expectEqual('320px', cs.getPropertyValue('width'));
  testing.expectEqual('78px', cs.getPropertyValue('height'));
  testing.expectEqual('flex', cs.getPropertyValue('display'));
  testing.expectEqual('rgb(12, 34, 56)', cs.getPropertyValue('color'));
  testing.expectEqual('rgb(240, 241, 242)', cs.getPropertyValue('background-color'));

  // Layout-facing DOM metrics must not fall back to the old synthetic 5x5
  // dimensions when size came from a stylesheet rather than element.style.
  const rect = target.getBoundingClientRect();
  testing.expectEqual(320, rect.width);
  testing.expectEqual(78, rect.height);
  testing.expectEqual(320, target.offsetWidth);
  testing.expectEqual(78, target.offsetHeight);
  testing.expectEqual(320, target.clientWidth);
  testing.expectEqual(78, target.clientHeight);

  const important = document.createElement('div');
  important.setAttribute('class', 'computed-sheet-important');
  important.style.setProperty('color', 'red');
  document.body.appendChild(important);
  testing.expectEqual('green', window.getComputedStyle(important).getPropertyValue('color'));

  important.style.setProperty('color', 'blue', 'important');
  testing.expectEqual('blue', window.getComputedStyle(important).getPropertyValue('color'));

  const shorthand = document.createElement('div');
  shorthand.setAttribute('class', 'computed-sheet-shorthand');
  document.body.appendChild(shorthand);
  const shorthandStyle = window.getComputedStyle(shorthand);
  testing.expectEqual('#aabbcc', shorthandStyle.getPropertyValue('background-color'));
  testing.expectEqual('3px', shorthandStyle.getPropertyValue('border-width'));
  testing.expectEqual('solid', shorthandStyle.getPropertyValue('border-style'));
  testing.expectEqual('#445566', shorthandStyle.getPropertyValue('border-color'));
}
</script>
