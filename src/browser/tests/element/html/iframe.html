<!DOCTYPE html>
<script src="../../testing.js"></script>

<script id=iframe_sandbox_domtokenlist>
{
  const iframe = document.createElement('iframe');

  testing.expectEqual('object', typeof iframe.sandbox);
  testing.expectEqual('', iframe.sandbox.value);
  testing.expectEqual(null, iframe.getAttribute('sandbox'));

  iframe.sandbox.add('allow-scripts');
  testing.expectEqual('allow-scripts', iframe.sandbox.value);
  testing.expectEqual('allow-scripts', iframe.getAttribute('sandbox'));

  iframe.sandbox.value = 'allow-scripts allow-same-origin';
  testing.expectEqual('allow-scripts allow-same-origin', iframe.getAttribute('sandbox'));

  iframe.sandbox = 'allow-forms';
  testing.expectEqual('allow-forms', iframe.sandbox.value);
  testing.expectEqual('allow-forms', iframe.getAttribute('sandbox'));

  testing.expectEqual('function', typeof iframe.sandbox.supports);
  testing.expectEqual(true, iframe.sandbox.supports('allow-scripts'));
  testing.expectEqual(true, iframe.sandbox.supports('allow-same-origin'));
  testing.expectEqual(true, iframe.sandbox.supports('allow-storage-access-by-user-activation'));
  testing.expectEqual(false, iframe.sandbox.supports('allow-not-real'));
}
</script>
