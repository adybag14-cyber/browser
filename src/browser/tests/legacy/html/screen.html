<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=screen>
  let screen = window.screen;
  testing.expectEqual(true, screen.width > 0);
  testing.expectEqual(true, screen.height > 0);
  testing.expectEqual(true, screen.availWidth > 0);
  testing.expectEqual(true, screen.availHeight > 0);
  testing.expectEqual(true, screen.availWidth <= screen.width);
  testing.expectEqual(true, screen.availHeight <= screen.height);

  let orientation = screen.orientation;
  testing.expectEqual(0, orientation.angle);
  testing.expectEqual('landscape-primary', orientation.type);

  // this shouldn't crash (it used to)
  screen.addEventListener('change', () => {});
</script>

<script id=orientation>
  screen.orientation.addEventListener('change', () => {})
  // above shouldn't crash (it used to)
  testing.expectEqual(true, true);
</script>
