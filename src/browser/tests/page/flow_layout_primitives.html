<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html { font-size: 62.5%; }
body { margin: 0; font-family: Arial, sans-serif; }
#inline-host { width: 15.6rem; background: rgb(248,249,250); }
#inline-link { display: block; width: 15.6rem; }
#mixed-inline { display: inline-block; font-size: 1.3rem; line-height: 1.6; }
#word-row { width: 135px; font-size: 1.3rem; }
#padded-host { width: 260px; }
#padded-link { display: inline-block; width: 90%; padding: 13px; }
#padded-icon { display: inline-block; width: 50px; height: 47px; }
#padded-text { display: inline-block; width: 122px; height: 40px; }
#input-wrap { display: inline-block; width: 394px; background: rgb(230,240,250); }
#flow-input { display: inline-block; box-sizing: border-box; width: 100%; height: 44px; margin: 0; border: 0; padding: 0; }
#empty-helper { }
#float-host { width: 780px; background: rgb(245,245,245); }
.float-tile { float: left; width: 33%; height: 90px; background: rgb(210,220,230); }
#float-wrap-host { width: 780px; background: rgb(248,248,248); }
.clear-float { float: left; clear: left; width: 35%; }
#clear-a { height: 70px; }
#clear-b { height: 90px; }
#float-main { display: inline-block; width: 65%; height: 180px; background: rgb(225,235,245); }
</style>
</head>
<body>
<div id="inline-host"><a id="inline-link"><small id="mixed-inline">7,189,000+ <span>articles</span></small></a></div>
<div id="word-row">Free media collection</div>
<div id="padded-host"><a id="padded-link"><span id="padded-icon"></span><span id="padded-text"></span></a></div>
<div id="input-wrap"><input id="flow-input"><div id="empty-helper"></div></div>
<div id="float-host">
  <div class="float-tile" id="float-a"></div>
  <div class="float-tile" id="float-b"></div>
  <div class="float-tile" id="float-c"></div>
</div>
<div id="float-wrap-host">
  <div class="clear-float" id="clear-a"></div>
  <div class="clear-float" id="clear-b"></div>
  <div id="float-main"></div>
</div>
<script>
function reportFlowLayout(){
  function r(id){return document.getElementById(id).getBoundingClientRect()}
  const mixed=r('mixed-inline'), wordRow=r('word-row'), wrap=r('input-wrap'), input=r('flow-input'), empty=r('empty-helper');
  const paddedHost=r('padded-host'), paddedLink=r('padded-link'), paddedIcon=r('padded-icon'), paddedText=r('padded-text');
  const host=r('float-host'), a=r('float-a'), b=r('float-b'), c=r('float-c');
  const wrapHost=r('float-wrap-host'), clearA=r('clear-a'), clearB=r('clear-b'), main=r('float-main');
  const q=[
    'mixed_w='+Math.round(mixed.width),'mixed_h='+Math.round(mixed.height),
    'word_row_w='+Math.round(wordRow.width),'word_row_h='+Math.round(wordRow.height),
    'padded_host_x='+Math.round(paddedHost.x),'padded_host_w='+Math.round(paddedHost.width),
    'padded_link_x='+Math.round(paddedLink.x),'padded_link_w='+Math.round(paddedLink.width),
    'padded_icon_x='+Math.round(paddedIcon.x),'padded_icon_w='+Math.round(paddedIcon.width),
    'padded_text_x='+Math.round(paddedText.x),'padded_text_w='+Math.round(paddedText.width),
    'wrap_w='+Math.round(wrap.width),'wrap_h='+Math.round(wrap.height),
    'input_w='+Math.round(input.width),'input_h='+Math.round(input.height),
    'empty_h='+Math.round(empty.height),
    'float_host_w='+Math.round(host.width),'float_host_h='+Math.round(host.height),
    'a_x='+Math.round(a.x),'a_y='+Math.round(a.y),'a_w='+Math.round(a.width),'a_h='+Math.round(a.height),
    'b_x='+Math.round(b.x),'b_y='+Math.round(b.y),'b_w='+Math.round(b.width),'b_h='+Math.round(b.height),
    'c_x='+Math.round(c.x),'c_y='+Math.round(c.y),'c_w='+Math.round(c.width),'c_h='+Math.round(c.height),
    'wrap_float_host_w='+Math.round(wrapHost.width),'wrap_float_host_h='+Math.round(wrapHost.height),
    'clear_a_x='+Math.round(clearA.x),'clear_a_y='+Math.round(clearA.y),'clear_a_w='+Math.round(clearA.width),'clear_a_h='+Math.round(clearA.height),
    'clear_b_x='+Math.round(clearB.x),'clear_b_y='+Math.round(clearB.y),'clear_b_w='+Math.round(clearB.width),'clear_b_h='+Math.round(clearB.height),
    'float_main_x='+Math.round(main.x),'float_main_y='+Math.round(main.y),'float_main_w='+Math.round(main.width),'float_main_h='+Math.round(main.height)
  ];
  fetch('/flow-layout-geometry?'+q.join('&'),{method:'POST'}).catch(()=>{});
}
addEventListener('load',()=>{setTimeout(reportFlowLayout,300);setTimeout(reportFlowLayout,1000)});
</script>
</body>
</html>
